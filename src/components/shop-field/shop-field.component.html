<v-select-field
    [appearance]="appearance"
    [externalSearch]="!partyId()"
    [formField]="control"
    [hint]="hint"
    [label]="label || (multiple() ? 'Shops' : 'Shop')"
    [multiple]="multiple()"
    [options]="shops.value()"
    [placeholder]="placeholder"
    [progress]="shops.isLoading()"
    [size]="size"
    (searchChange)="shops.setParams((p) => ({ ...p, query: $event }))"
    (touch)="touch.emit()"
></v-select-field>
