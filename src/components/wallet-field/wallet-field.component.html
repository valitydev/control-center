<v-select-field
    [appearance]="appearance"
    [externalSearch]="!partyId()"
    [formControl]="control"
    [hint]="hint"
    [label]="label || (multiple() ? 'Wallets' : 'Wallet')"
    [multiple]="multiple()"
    [options]="wallets.value()"
    [progress]="wallets.isLoading()"
    [required]="required"
    [size]="size"
    (searchChange)="wallets.setParams((p) => ({ ...p, query: $event }))"
></v-select-field>
