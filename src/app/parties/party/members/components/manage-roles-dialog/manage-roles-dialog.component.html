<v-dialog
    [description]="dialogData.userEmail || dialogData.userId"
    [progress]="member.isLoading() || progress()"
    title="Manage roles"
>
    @if (!member.isLoading()) {
        <cc-role-assignments-field [formField]="control" [partyId]="dialogData.partyId" />
    }

    <v-dialog-actions>
        <button mat-button (click)="closeWithCancellation()">Cancel</button>
        <button
            [disabled]="member.isLoading() || progress() || control().invalid()"
            mat-flat-button
            (click)="save()"
        >
            Save
        </button>
    </v-dialog-actions>
</v-dialog>
