<v-dialog
    [progress]="member.isLoading() || assignProgress()"
    [title]="'Member Roles: ' + (dialogData.userEmail || dialogData.userId)"
>
    <div class="flex flex-col gap-6">
        <div class="flex flex-col gap-2">
            <h3 class="mat-title-small text-[var(--mat-sys-on-surface)]">Assigned roles</h3>
            <v-table [columns]="columns" [data]="member.value()?.roles || []" />
        </div>

        <div class="flex flex-col gap-4 border-t pt-4 border-[var(--mat-sys-outline-variant)]">
            <h3 class="mat-title-small text-[var(--mat-sys-on-surface)]">Assign role</h3>
            <cc-role-assignment-field [formField]="newRoleControl" [partyId]="dialogData.partyId" />
            <div class="flex justify-end">
                <button
                    [disabled]="assignProgress() || newRoleControl().invalid()"
                    mat-flat-button
                    (click)="assign()"
                >
                    Assign
                </button>
            </div>
        </div>
    </div>

    <v-dialog-actions>
        <button mat-button (click)="closeDialog()">Close</button>
    </v-dialog-actions>
</v-dialog>
