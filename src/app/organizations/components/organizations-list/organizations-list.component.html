<cc-page-layout fullHeight title="Organizations">
    <cc-page-layout-actions>
        <button mat-flat-button (click)="create()">Create</button>
        <v-more-filters-button [filters]="filtersComponent"></v-more-filters-button>
    </cc-page-layout-actions>
    <v-filters #filtersComponent [active]="active()" merge (clear)="resetFilters()">
        <ng-template>
            <v-input-field
                [formField]="filtersControl.owner_id"
                cleanButton
                label="Owner ID"
            ></v-input-field>
            <v-select-field
                [formField]="filtersControl.status"
                [options]="statusOptions"
                label="Status"
            ></v-select-field>
        </ng-template>
    </v-filters>
    <v-table-resource [columns]="columns" [resource]="organizations" />
</cc-page-layout>
