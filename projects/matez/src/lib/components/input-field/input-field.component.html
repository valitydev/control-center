<mat-form-field
    [appearance]="appearance"
    [ngClass]="{
        'v-input-field__small': size === 'small',
        'v-input-field__outline': appearance === 'outline',
    }"
    class="v-input-field"
>
    @if (icon()) {
        <div class="prefix" matPrefix>
            <mat-icon>{{ icon() }}</mat-icon>
        </div>
    }
    <mat-label>{{ label }}</mat-label>
    <input
        [formField]="control"
        [placeholder]="placeholder"
        [type]="type"
        autocomplete="false"
        matInput
        (blur)="touch.emit()"
    />
    <div class="postfix" matSuffix>
        @if (cleanButton()) {
            <button
                [disabled]="!value()"
                [style.visibility]="value() ? '' : 'hidden'"
                mat-icon-button
                type="button"
                (click)="control().reset(); value.set(undefined)"
            >
                <mat-icon>clear</mat-icon>
            </button>
        }
    </div>
    @if (hintText()) {
        <mat-hint>{{ hintText() }}</mat-hint>
    }
</mat-form-field>
